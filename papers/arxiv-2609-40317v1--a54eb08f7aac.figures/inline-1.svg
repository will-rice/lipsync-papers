<svg id="A3.SS2.p2.pic1" class="ltx_picture" height="754.68" overflow="visible" version="1.1" viewbox="0 0 477.38 754.68" width="477.38"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,754.68) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#333333;" fill="#333333" fill-opacity="1.0"><path style="stroke:none" d="M 0 0 L 0 754.68 L 477.38 754.68 L 477.38 0 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 0.69 0.69 L 0.69 753.98 L 476.68 753.98 L 476.68 0.69 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 20.38 15.58)"><foreignobject style="--ltx-fo-width:30.06em;--ltx-fo-height:52.51em;--ltx-fo-depth:0.22em;font-size:10pt;" height="729.68" overflow="visible" transform="matrix(1 0 0 -1 0 726.6)" width="415.95"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="A3.SS2.p2.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:30.06em;">
<span id="A3.SS2.p2.pic1.1.1" class="ltx_p"><span id="A3.SS2.p2.pic1.1.1.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You are an expert in speech prosody analysis.
</span></span>
<span id="A3.SS2.p2.pic1.1.2" class="ltx_p"><span id="A3.SS2.p2.pic1.1.2.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">You will be given an audio segment containing one speaker. Detect only the time intervals where the speaker shows a clear and localized prosodic fluctuation. A prosodic fluctuation means a noticeable change in vocal delivery, such as increased pitch, increased loudness, stronger stress, sharper emphasis, faster or slower speaking rate, unusual rhythm, hesitation, excitement, surprise, or other affective vocal variation. Focus only on acoustic and prosodic cues, not on the semantic meaning of the spoken words.
</span></span>
<span id="A3.SS2.p2.pic1.1.3" class="ltx_p"><span id="A3.SS2.p2.pic1.1.3.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">For each detected prosodic event, output its start time, end time, and intensity score. The intensity score must be between 0 and 1 and should represent the salience of the prosodic change:
</span></span>
<span id="A3.SS2.p2.pic1.1.4" class="ltx_p"><span id="A3.SS2.p2.pic1.1.4.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- 0.50-0.60: weak but noticeable;
</span></span>
<span id="A3.SS2.p2.pic1.1.5" class="ltx_p"><span id="A3.SS2.p2.pic1.1.5.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- 0.60-0.80: clear;
</span></span>
<span id="A3.SS2.p2.pic1.1.6" class="ltx_p"><span id="A3.SS2.p2.pic1.1.6.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- 0.80-1.00: strong or highly salient.
</span></span>
<span id="A3.SS2.p2.pic1.1.7" class="ltx_p"><span id="A3.SS2.p2.pic1.1.7.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Detection rules:
</span></span>
<span id="A3.SS2.p2.pic1.1.8" class="ltx_p"><span id="A3.SS2.p2.pic1.1.8.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Only output events with intensity score &gt;= 0.50.
</span></span>
<span id="A3.SS2.p2.pic1.1.9" class="ltx_p"><span id="A3.SS2.p2.pic1.1.9.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Do not output uncertain or ambiguous events.
</span></span>
<span id="A3.SS2.p2.pic1.1.10" class="ltx_p"><span id="A3.SS2.p2.pic1.1.10.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Do not split one continuous prosodic fluctuation into many short intervals.
</span></span>
<span id="A3.SS2.p2.pic1.1.11" class="ltx_p"><span id="A3.SS2.p2.pic1.1.11.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Merge neighboring intervals if they are part of the same prosodic event.
</span></span>
<span id="A3.SS2.p2.pic1.1.12" class="ltx_p"><span id="A3.SS2.p2.pic1.1.12.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- No interval overlapping.
</span></span>
<span id="A3.SS2.p2.pic1.1.13" class="ltx_p"><span id="A3.SS2.p2.pic1.1.13.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Prefer concise intervals that cover the main fluctuation rather than long segments with neutral speech.
</span></span>
<span id="A3.SS2.p2.pic1.1.14" class="ltx_p"><span id="A3.SS2.p2.pic1.1.14.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Output format:
</span></span>
<span id="A3.SS2.p2.pic1.1.15" class="ltx_p"><span id="A3.SS2.p2.pic1.1.15.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Each line must be: start_time, end_time, intensity_score
</span></span>
<span id="A3.SS2.p2.pic1.1.16" class="ltx_p"><span id="A3.SS2.p2.pic1.1.16.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- All numbers must use exactly two decimal places.
</span></span>
<span id="A3.SS2.p2.pic1.1.17" class="ltx_p"><span id="A3.SS2.p2.pic1.1.17.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Use seconds as the time unit.
</span></span>
<span id="A3.SS2.p2.pic1.1.18" class="ltx_p"><span id="A3.SS2.p2.pic1.1.18.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- Do not output any explanation, label, markdown, bullet point, or extra text.
</span></span>
<span id="A3.SS2.p2.pic1.1.19" class="ltx_p"><span id="A3.SS2.p2.pic1.1.19.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">- If no valid event is detected, output exactly:
</span></span>
<span id="A3.SS2.p2.pic1.1.20" class="ltx_p"><span id="A3.SS2.p2.pic1.1.20.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">NULL
</span></span>
<span id="A3.SS2.p2.pic1.1.21" class="ltx_p"><span id="A3.SS2.p2.pic1.1.21.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Example:
</span></span>
<span id="A3.SS2.p2.pic1.1.22" class="ltx_p"><span id="A3.SS2.p2.pic1.1.22.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">2.34, 3.29, 0.78
</span></span>
<span id="A3.SS2.p2.pic1.1.23" class="ltx_p"><span id="A3.SS2.p2.pic1.1.23.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">5.69, 7.29, 0.92
</span></span>
<span id="A3.SS2.p2.pic1.1.24" class="ltx_p"><span id="A3.SS2.p2.pic1.1.24.1" class="ltx_text ltx_font_typewriter" style="--ltx-fg-color:#000000;">Analyze the audio now and output only the formatted results.
</span></span>
</span></span></span></foreignobject></g></g></svg>