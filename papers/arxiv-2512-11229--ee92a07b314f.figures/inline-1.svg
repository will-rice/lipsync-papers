<svg id="S3.SS2.p5.pic1" class="ltx_picture" height="371.95" overflow="visible" version="1.1" viewbox="0 0 238.69 371.95" width="238.69"><g style="--ltx-stroke-color:#000000;--ltx-fill-color:#000000;" fill="#000000" stroke="#000000" stroke-width="0.4pt" transform="translate(0,371.95) matrix(1 0 0 -1 0 0)"><g style="--ltx-fill-color:#404040;" fill="#404040" fill-opacity="1.0"><path style="stroke:none" d="M 0 5.91 L 0 366.04 C 0 369.3 2.64 371.95 5.91 371.95 L 232.78 371.95 C 236.04 371.95 238.69 369.3 238.69 366.04 L 238.69 5.91 C 238.69 2.64 236.04 0 232.78 0 L 5.91 0 C 2.64 0 0 2.64 0 5.91 Z" /></g><g style="--ltx-fill-color:#F2F2F2;" fill="#F2F2F2" fill-opacity="1.0"><path style="stroke:none" d="M 1.97 5.91 L 1.97 366.04 C 1.97 368.22 3.73 369.98 5.91 369.98 L 232.78 369.98 C 234.96 369.98 236.72 368.22 236.72 366.04 L 236.72 5.91 C 236.72 3.73 234.96 1.97 232.78 1.97 L 5.91 1.97 C 3.73 1.97 1.97 3.73 1.97 5.91 Z" /></g><g fill-opacity="1.0" transform="matrix(1.0 0.0 0.0 1.0 21.65 16.47)"><foreignobject style="--ltx-fo-width:14.12em;--ltx-fo-height:24.69em;--ltx-fo-depth:0.19em;font-size:10pt;" height="344.39" overflow="visible" transform="matrix(1 0 0 -1 0 341.7)" width="195.38"><span class="ltx_foreignobject_container"><span class="ltx_foreignobject_content">
<span id="S3.SS2.p5.pic1.1" class="ltx_inline-block ltx_minipage ltx_align_bottom" style="width:14.12em;">
<span id="S3.SS2.p5.pic1.1.1" class="ltx_p"><span id="S3.SS2.p5.pic1.1.1.1" class="ltx_text ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#000000;">ID-Sink Principle</span><span id="S3.SS2.p5.pic1.1.1.2" class="ltx_text" style="--ltx-fg-color:#000000;">: ID-Sink models the Key-Value (KV) embeddings of the reference image as a persistent sink across all chunks, establishing a global semantic anchor to preserve identity fidelity.</span></span>
<span id="S3.SS2.p5.pic1.1.2" class="ltx_p"><span id="S3.SS2.p5.pic1.1.2.1" class="ltx_text ltx_font_bold ltx_font_italic" style="--ltx-fg-color:#000000;">Context-Cache Principle</span><span id="S3.SS2.p5.pic1.1.2.2" class="ltx_text" style="--ltx-fg-color:#000000;">: Context Cache approximates a continuous temporal flow by extending the effective temporal receptive field. It reconstructs local temporal dependencies by concatenating the KV embeddings of the preceding chunk with the current KV embedding during self-attention, thereby mitigating boundary discontinuities of streaming generation.</span></span>
</span></span></span></foreignobject></g></g></svg>