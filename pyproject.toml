[project]
name = "lipsync-papers"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<0.29",
  "httpx2>=2.5,<3",
  "mcp>=2.2,<3",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=4.3,<5",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<0.13",
  "ty>=0.0.84,<0.1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
papers-pipeline = "papers_pipeline.cli:app"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["src/papers_pipeline"]
# Editable installs also expose the repository root so the topic plugin
# (topic_plugin:accept_topic) imports when papers-pipeline runs.
dev-mode-dirs = ["src", "."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
