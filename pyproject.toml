[project]
name = "lipsync-papers"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28,<0.29",
  "httpx2>=2.5,<3",
  "mcp>=2.2,<3",
  "Pillow>=11.3,<12",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=4.3,<5",
  "pypandoc-binary==1.15",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<0.13",
  "ty>=0.0.84,<0.1",
  "types-PyYAML>=6.0.12,<7",
]
# What the nightly converts papers with. Locked like everything else, so a new
# upstream release cannot change what a run installs.
convert = [
  "docling==2.135.0",
  "pypandoc-binary==1.15",
  # docling 2.135.0 imports a name that rapidocr 3.10.0 removed.
  "rapidocr>=3.9.1,<3.10",
  "torch>=2.14.1",
  "torchvision>=0.29.1",
]

# docling needs torch; the nightly runner has no GPU, and the default wheels
# bring gigabytes of CUDA libraries.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
papers-pipeline = "papers_pipeline.cli:app"

[tool.pytest.ini_options]
# conversion tests run the real converters and need the convert extra; CI's
# conversion job selects them with `-m conversion`.
addopts = "-q -m 'not conversion'"
markers = ["conversion: runs docling and pandoc for real"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["src/papers_pipeline"]
# Editable installs also expose the repository root so the topic plugin
# (topic_plugin:accept_topic) imports when papers-pipeline runs.
dev-mode-dirs = ["src", "."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
