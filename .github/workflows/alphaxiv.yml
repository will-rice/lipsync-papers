name: Sync alphaXiv collection

on:
  workflow_run:
    workflows: ["Nightly papers"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alphaxiv-collection
  cancel-in-progress: false

jobs:
  sync:
    # Repositories opt in by setting the ALPHAXIV_COLLECTION variable.
    if: vars.ALPHAXIV_COLLECTION != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        timeout-minutes: 2
        with:
          python-version: "3.12"
      - name: Sync locked environment
        timeout-minutes: 3
        run: |
          python -m pip install uv==0.8.17
          uv sync --locked
      - name: Sync collection
        timeout-minutes: 20
        env:
          ALPHAXIV_API_KEY: ${{ secrets.ALPHAXIV_API_KEY }}
          ALPHAXIV_COLLECTION: ${{ vars.ALPHAXIV_COLLECTION }}
        run: uv run python -m papers_pipeline.alphaxiv_sync
