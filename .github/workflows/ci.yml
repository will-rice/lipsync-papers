name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        timeout-minutes: 2
        with:
          python-version: "3.12"
      - name: Install uv
        timeout-minutes: 2
        run: python -m pip install uv==0.8.17
      - name: Sync locked environment
        timeout-minutes: 5
        run: uv sync --locked --extra dev
      - name: Validate configuration
        timeout-minutes: 1
        run: uv run papers-pipeline validate --config papers.yml --config-only
      - name: Run pre-commit
        timeout-minutes: 5
        run: uv run pre-commit run --all-files
      - name: Run tests
        timeout-minutes: 10
        run: uv run pytest
