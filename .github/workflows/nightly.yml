name: Nightly papers

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: nightly-papers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Hosted runners allow 6 hours; conversion stops starting batches at its
    # deadline_seconds so the run pushes well before this.
    timeout-minutes: 350
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        timeout-minutes: 2
        with:
          fetch-depth: 0
          ref: main
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        timeout-minutes: 2
        with:
          python-version: "3.12"
      - name: Install uv
        timeout-minutes: 2
        run: python -m pip install uv==0.8.17
      - name: Sync locked environment
        timeout-minutes: 5
        run: uv sync --locked
      - name: Install pinned runtime tools
        timeout-minutes: 15
        run: |
          uv tool install marker-pdf==1.10.1
          uv pip install --no-deps pypandoc-binary==1.15
          npm install --global prettier@3.6.2
          mkdir -p "$HOME/.local/bin"
          uv run python - <<'PY'
          from pathlib import Path
          import pypandoc

          target = Path.home() / ".local/bin/pandoc"
          target.symlink_to(pypandoc.get_pandoc_path())
          PY
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run and publish bounded batches
        id: run
        timeout-minutes: 330
        env:
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: .github/scripts/nightly.sh
      # Chain runs back to back while backfill or conversion is progressing;
      # a failed run or one with nothing left to do ends the chain.
      - name: Continue while work remains
        if: steps.run.outputs.more_work == 'true'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run nightly.yml --ref "$GITHUB_REF_NAME"
